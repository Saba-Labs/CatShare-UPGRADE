<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img" aria-label="Default Store theme preview">
  <rect width="800" height="500" fill="#f7f7f5"/>
  <rect x="0" y="0" width="800" height="500" fill="url(#bgGrad)"/>
  <defs>
    <linearGradient id="bgGrad" x1="400" y1="0" x2="400" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f7f5"/>
      <stop offset="1" stop-color="#f2f2f0"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Phone frame -->
  <rect x="248" y="24" width="304" height="452" rx="28" fill="#ffffff" stroke="#e8e8e5" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Store hero -->
  <rect x="248" y="24" width="304" height="118" fill="#f7f7f5"/>
  <line x1="248" y1="142" x2="552" y2="142" stroke="#e8e8e5" stroke-width="1"/>
  <rect x="268" y="44" width="44" height="44" rx="10" fill="#f2f2f0" stroke="#e8e8e5"/>
  <path d="M280 66h20M280 74h14" stroke="#c4c4c0" stroke-width="2" stroke-linecap="round"/>
  <rect x="452" y="52" width="80" height="24" rx="12" fill="#e8f4ef" stroke="#1a6b4a" stroke-opacity="0.2"/>
  <circle cx="464" cy="64" r="3" fill="#1a6b4a"/>
  <text x="472" y="68" fill="#1a6b4a" font-family="system-ui,sans-serif" font-size="9" font-weight="600">Open now</text>
  <text x="268" y="112" fill="#1a1a1a" font-family="Georgia,serif" font-size="20">My Store</text>
  <text x="268" y="128" fill="#555555" font-family="system-ui,sans-serif" font-size="9">Quality products at honest prices.</text>

  <!-- Search + categories -->
  <rect x="264" y="156" width="272" height="30" rx="15" fill="#ffffff" stroke="#e0e0dc"/>
  <text x="286" y="175" fill="#999999" font-family="system-ui,sans-serif" font-size="10">Search items...</text>
  <rect x="264" y="196" width="36" height="22" rx="11" fill="#1a6b4a"/>
  <text x="272" y="211" fill="#ffffff" font-family="system-ui,sans-serif" font-size="9" font-weight="600">All</text>
  <rect x="306" y="196" width="52" height="22" rx="11" fill="#ffffff" stroke="#e0e0dc"/>
  <text x="314" y="211" fill="#555555" font-family="system-ui,sans-serif" font-size="9">Snacks</text>
  <rect x="364" y="196" width="48" height="22" rx="11" fill="#ffffff" stroke="#e0e0dc"/>
  <text x="372" y="211" fill="#555555" font-family="system-ui,sans-serif" font-size="9">Drinks</text>

  <!-- Product list row 1 -->
  <rect x="264" y="232" width="272" height="72" rx="14" fill="#ffffff" stroke="#e8e8e5" filter="url(#cardShadow)"/>
  <rect x="276" y="244" width="48" height="48" rx="8" fill="#f2f2f0"/>
  <rect x="334" y="248" width="96" height="8" rx="4" fill="#1a1a1a"/>
  <rect x="334" y="262" width="64" height="6" rx="3" fill="#999999"/>
  <text x="334" y="284" fill="#1a1a1a" font-family="system-ui,sans-serif" font-size="11" font-weight="700">₹120</text>
  <rect x="468" y="256" width="56" height="24" rx="12" fill="#f2f2f0" stroke="#e0e0dc"/>
  <text x="482" y="272" fill="#555555" font-family="system-ui,sans-serif" font-size="12">−  1  +</text>

  <!-- Product list row 2 -->
  <rect x="264" y="314" width="272" height="72" rx="14" fill="#ffffff" stroke="#e8e8e5" filter="url(#cardShadow)"/>
  <rect x="276" y="326" width="48" height="48" rx="8" fill="#f2f2f0"/>
  <rect x="334" y="330" width="110" height="8" rx="4" fill="#1a1a1a"/>
  <rect x="334" y="344" width="72" height="6" rx="3" fill="#999999"/>
  <text x="334" y="366" fill="#1a1a1a" font-family="system-ui,sans-serif" font-size="11" font-weight="700">₹85</text>
  <rect x="468" y="338" width="56" height="24" rx="12" fill="#f2f2f0" stroke="#e0e0dc"/>
  <text x="482" y="354" fill="#555555" font-family="system-ui,sans-serif" font-size="12">−  0  +</text>

  <!-- Product list row 3 -->
  <rect x="264" y="396" width="272" height="72" rx="14" fill="#ffffff" stroke="#e8e8e5" filter="url(#cardShadow)"/>
  <rect x="276" y="408" width="48" height="48" rx="8" fill="#f2f2f0"/>
  <rect x="334" y="412" width="88" height="8" rx="4" fill="#1a1a1a"/>
  <rect x="334" y="426" width="56" height="6" rx="3" fill="#999999"/>
  <text x="334" y="448" fill="#1a1a1a" font-family="system-ui,sans-serif" font-size="11" font-weight="700">₹250</text>
  <rect x="468" y="420" width="56" height="24" rx="12" fill="#f2f2f0" stroke="#e0e0dc"/>
  <text x="482" y="436" fill="#555555" font-family="system-ui,sans-serif" font-size="12">−  2  +</text>

  <!-- Side labels -->
  <text x="40" y="48" fill="#1a1a1a" font-family="Georgia,serif" font-size="22">Default Store</text>
  <text x="40" y="76" fill="#555555" font-family="system-ui,sans-serif" font-size="13" width="180">Classic order-link catalog with store hero, search, and qty controls.</text>
  <rect x="40" y="100" width="14" height="14" rx="3" fill="#1a6b4a"/>
  <rect x="60" y="100" width="14" height="14" rx="3" fill="#f7f7f5" stroke="#e8e8e5"/>
  <rect x="80" y="100" width="14" height="14" rx="3" fill="#1a1a1a"/>
  <rect x="100" y="100" width="14" height="14" rx="3" fill="#ffffff" stroke="#e8e8e5"/>
</svg>
